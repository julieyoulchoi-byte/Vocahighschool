<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그림 단어장 362</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
/* Layout: 한 장의 큰 그림 카드를 가운데 두고, 위는 Day 선택, 아래는 학습 버튼. 문구점 단어 카드 느낌 */
:root{
  --bg:#eef3f1; --paper:#ffffff; --ink:#17322e; --muted:#5d716d; --line:#d3dfdb;
  --accent:#f2a531; --accent-ink:#3d2600; --teal:#1f6f63; --good:#2e8b57; --bad:#c8553d;
  --soft:#e3ece9;
  --f-display:"Do Hyeon","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-word:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a18; --paper:#182724; --ink:#e6f0ed; --muted:#9cb1ac; --line:#2b3f3b;
  --accent:#f5b54d; --accent-ink:#2a1a00; --teal:#5cc2b0; --good:#5cc98a; --bad:#ec8a73; --soft:#20322f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a18; --paper:#182724; --ink:#e6f0ed; --muted:#9cb1ac; --line:#2b3f3b;
  --accent:#f5b54d; --accent-ink:#2a1a00; --teal:#5cc2b0; --good:#5cc98a; --bad:#ec8a73; --soft:#20322f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;line-height:1.1;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--muted);margin-top:4px}
.prog{font-size:.9rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;width:160px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:1.1rem;padding:10px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 12px;font-family:var(--f-body);font-size:.88rem;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.65;margin-left:4px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer;background:var(--paper);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
/* 카드 */
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px -18px rgba(23,50,46,.45);overflow:hidden;cursor:pointer;user-select:none}
.pic{background:repeating-linear-gradient(0deg,transparent 0 27px,var(--soft) 27px 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 16px 20px;min-height:220px;position:relative}
.emo{font-size:clamp(4rem,18vw,6.5rem);line-height:1.1;letter-spacing:.05em;text-align:center}
.cap{font-size:1rem;color:var(--muted);text-align:center;max-width:32ch}
.num{position:absolute;top:12px;left:16px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.st{position:absolute;top:12px;right:16px;font-size:.8rem;padding:2px 10px;border-radius:99px}
.st.k{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.st.u{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.face{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border-top:1px dashed var(--line)}
.word{font-family:var(--f-word);font-weight:800;font-size:clamp(1.8rem,7vw,2.5rem);line-height:1.15;overflow-wrap:anywhere}
.mean{font-size:1.15rem;min-height:1.6em}
.hidden-txt{color:var(--muted);font-size:.95rem;border:1.5px dashed var(--line);border-radius:10px;padding:6px 14px}
.row{display:flex;gap:10px;align-items:center}
.btns{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px}
.b{border:0;border-radius:14px;padding:14px 12px;font-family:var(--f-display);font-size:1.15rem;cursor:pointer;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.b.no{background:color-mix(in srgb,var(--bad) 14%,var(--paper));color:var(--bad);border-color:transparent}
.b.yes{background:var(--teal);color:var(--paper);border-color:transparent}
.b.acc{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.b:disabled{opacity:.4;cursor:default}
.speak{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:.85rem;cursor:pointer;font-family:var(--f-body)}
.memo{display:flex;flex-direction:column;gap:6px}
.memo label{font-size:.88rem;color:var(--muted)}
textarea{width:100%;min-height:62px;font-family:var(--f-body);font-size:.95rem;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink);resize:vertical}
.hint{font-size:.85rem;color:var(--muted);text-align:center}
/* 퀴즈 */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 10px;cursor:pointer;font-family:var(--f-word);font-weight:600;font-size:1.15rem;min-height:64px;overflow-wrap:anywhere}
.ch.e{font-family:inherit;font-size:2.6rem;line-height:1.2}
.ch.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--paper))}
.ch.ng{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--paper))}
.qprompt{font-family:var(--f-word);font-weight:800;font-size:2.2rem;text-align:center;padding:30px 16px;overflow-wrap:anywhere}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 16px}
.big{font-family:var(--f-display);font-size:3rem;line-height:1}
.feedback{text-align:center;min-height:1.6em;font-size:1rem}
/* 목록 */
.search{width:100%;font-size:1rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:var(--f-body)}
.list{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .e{font-size:1.7rem;text-align:center}
.li .t{min-width:0}
.li .w{font-family:var(--f-word);font-weight:600;font-size:1.05rem}
.li .m{font-size:.88rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.k{background:var(--good)}.dot.u{background:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:420px){.btns{grid-template-columns:auto 1fr 1fr auto}.b{padding:12px 8px;font-size:1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .25s ease}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>그림 단어장 362<small>그림으로 장면을 떠올리고, 단어를 꺼내 보세요</small></h1>
    <div class="prog"><span id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-study" aria-selected="true" data-tab="study">그림 카드</button>
    <button role="tab" id="tab-quiz" aria-selected="false" data-tab="quiz">그림 퀴즈</button>
    <button role="tab" id="tab-list" aria-selected="false" data-tab="list">전체 목록</button>
  </div>

  <div class="days" id="days" aria-label="학습 범위"></div>

  <section id="view"></section>
</div>

  const u=W.filter(x=>status[x.id]==='u').length;
  h+=`<button class="chip" aria-pressed="${S.day==='review'}" data-day="review">다시 볼 단어<span class="n">${u}</span></button>`;
  h+=`<button class="chip" aria-pressed="${S.day==='all'}" data-day="all">전체<span class="n">${W.length}</span></button>`;
  box.innerHTML=h;
}
$('#days').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;const v=b.dataset.day;S.day=(v==='all'||v==='review')?v:+v;S.idx=0;S.quiz=null;save();render()});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.quiz=null;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));render()});

/* ---------- 그림 카드 ---------- */
let revealed=false;
function renderStudy(){
  const P=pool();const v=$('#view');
  if(!P.length){v.innerHTML=`<div class="card"><div class="empty">${S.day==='review'?'다시 볼 단어가 없어요. 카드에서 "몰라요"를 누른 단어가 여기에 모여요.':'이 범위의 단어를 모두 외웠어요! 🎉 "외운 단어 숨기기"를 끄면 다시 볼 수 있어요.'}</div></div>`+optsHTML();bindOpts();return}
  if(S.idx>=P.length)S.idx=0;
  const x=P[S.idx],st=status[x.id];
  const hw=S.hide==='word'&&!revealed, hm=S.hide==='mean'&&!revealed;
  v.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:14px">
  ${optsHTML()}
  <div class="card pop" id="card" tabindex="0" aria-label="카드를 눌러 정답 보기">
    <div class="pic">
      <span class="num">${S.idx+1} / ${P.length} · #${x.id+1}</span>
      ${st?`<span class="st ${st}">${st==='k'?'외웠어요':'다시 보기'}</span>`:''}
      <div class="emo">${x.e}</div>
      <div class="cap">${esc(x.c)}</div>
    </div>
    <div class="face">
      ${hw?`<div class="hidden-txt">이 장면에 맞는 영어 단어는? (눌러서 확인)</div>`:`<div class="row"><div class="word">${esc(x.w)}</div></div><button class="speak" id="spk">🔊 발음 듣기</button>`}
      ${hm?`<div class="hidden-txt">뜻을 떠올린 뒤 카드를 눌러 확인</div>`:`<div class="mean">${esc(x.m)}</div>`}
    </div>
  </div>
  <div class="btns">
    <button class="b" id="prev" aria-label="이전">◀</button>
    <button class="b no" id="no">몰라요</button>
    <button class="b yes" id="yes">외웠어요</button>
    <button class="b" id="next" aria-label="다음">▶</button>
  </div>
  <div class="memo"><label for="memoBox">나만의 연상 메모 · 그림을 보고 떠오른 나만의 이야기를 적으면 더 오래 기억나요</label>
  <textarea id="memoBox" placeholder="예) despite: 비가 와도 '디스(this) 핏(fit)'한 운동복 입고 달린다">${esc(memo[x.id]||'')}</textarea></div>
  <p class="hint">키보드: 스페이스 = 뒤집기, ← → = 이동, 1 = 몰라요, 2 = 외웠어요</p>
  </div>`;
  bindOpts();
  const card=$('#card');
  card.onclick=e=>{if(e.target.closest('#spk'))return;revealed=!revealed;renderStudy()};
  const sp=$('#spk');if(sp)sp.onclick=()=>speak(x.w);
  $('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
  $('#no').onclick=()=>mark('u');$('#yes').onclick=()=>mark('k');
  $('#memoBox').oninput=e=>{const t=e.target.value;if(t.trim())memo[x.id]=t;else delete memo[x.id];store.set('memo',memo)};
}
function optsHTML(){return `<div class="opts">
  <label><input type="radio" name="hide" id="h-mean" value="mean" ${S.hide==='mean'?'checked':''}> 뜻 가리기</label>
  <label><input type="radio" name="hide" id="h-word" value="word" ${S.hide==='word'?'checked':''}> 단어 가리기</label>
  <label><input type="radio" name="hide" id="h-none" value="none" ${S.hide==='none'?'checked':''}> 모두 보기</label>
  ${S.day!=='review'?`<label><input type="checkbox" id="onlyU" ${S.onlyU?'checked':''}> 외운 단어 숨기기</label>`:''}
  </div>`}
function bindOpts(){document.querySelectorAll('input[name=hide]').forEach(r=>r.onchange=()=>{S.hide=r.value;revealed=false;save();renderStudy()});const o=$('#onlyU');if(o)o.onchange=()=>{S.onlyU=o.checked;S.idx=0;renderStudy()}}
function move(d){const n=pool().length;if(!n)return;S.idx=(S.idx+d+n)%n;revealed=false;renderStudy()}
function mark(v){const P=pool();const x=P[S.idx];if(!x)return;status[x.id]=v;save();renderDays();revealed=false;
  const removed=(S.onlyU&&v==='k')||(S.day==='review'&&v==='k');
  if(!removed)S.idx=(S.idx+1)%P.length;renderStudy()}
document.addEventListener('keydown',e=>{if(S.tab!=='study'||e.target.matches('textarea,input'))return;
  if(e.key===' '){e.preventDefault();revealed=!revealed;renderStudy()}
  else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='1')mark('u');else if(e.key==='2')mark('k')});

/* ---------- 그림 퀴즈 ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function newQuiz(type){
  let P=rangeOf(S.day);if(!P.length)return null;
  const qs=shuffle(P).slice(0,Math.min(10,P.length)).map(x=>{
    const near=W.slice(Math.max(0,x.id-40),x.id+40).filter(y=>y.id!==x.id);
    const ops=shuffle([x,...shuffle(near).slice(0,3)]);
    return {x,ops,t:type==='mix'?(Math.random()<.5?'p2w':'w2p'):type};
  });
  return {qs,i:0,score:0,wrong:[],answered:false,type};
}
function renderQuiz(){
  const v=$('#view');
  if(!S.quiz){
    const n=rangeOf(S.day).length;
    v.innerHTML=`<div class="card" style="cursor:default"><div class="result">
      <div class="big">🧩</div>
      <div style="font-family:var(--f-display);font-size:1.4rem">${n?`이 범위에서 ${Math.min(10,n)}문제`:'다시 볼 단어가 없어요'}</div>
      ${n?`<div class="hint">틀린 단어는 자동으로 "다시 볼 단어"에 들어가요</div>
      <div style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px">
        <button class="b acc" data-q="p2w">그림 보고 단어 고르기</button>
        <button class="b" data-q="w2p">단어 보고 그림 고르기</button>
        <button class="b" data-q="mix">섞어서 풀기</button>
      </div>`:''}
    </div></div>`;
    v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.quiz=newQuiz(b.dataset.q);renderQuiz()});
    return;
  }
  const Q=S.quiz;
  if(Q.i>=Q.qs.length){
    v.innerHTML=`<div class="card" style="cursor:default"><div class="result">
      <div class="big">${Q.score} / ${Q.qs.length}</div>
      <div style="font-family:var(--f-display);font-size:1.3rem">${Q.score===Q.qs.length?'완벽해요! 🎉':Q.score>=Q.qs.length*.7?'잘했어요! 틀린 것만 한 번 더':'다시 볼 단어로 복습해 봐요'}</div>
      ${Q.wrong.length?`<div style="display:flex;flex-direction:column;gap:6px;width:100%">${Q.wrong.map(x=>`<div class="li" style="border:1px solid var(--line);border-radius:12px;cursor:default"><div class="e">${x.e}</div><div class="t"><div class="w">${esc(x.w)}</div><div class="m">${esc(x.m)}</div></div><span></span></div>`).join('')}</div>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="b acc" id="again">다시 풀기</button><button class="b" id="back">유형 고르기</button></div>
    </div></div>`;
    $('#again').onclick=()=>{S.quiz=newQuiz(Q.type);renderQuiz()};$('#back').onclick=()=>{S.quiz=null;renderQuiz()};
    return;
  }
  const q=Q.qs[Q.i],x=q.x;
  const prompt=q.t==='p2w'
    ?`<div class="pic"><div class="emo">${x.e}</div><div class="cap">${esc(x.c)}</div></div>`
    :`<div class="qprompt">${esc(x.w)}</div><div class="hint" style="padding-bottom:14px">이 단어에 맞는 그림은?</div>`;
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="qtop"><span>문제 ${Q.i+1} / ${Q.qs.length}</span><span>맞힌 개수 ${Q.score}</span></div>
    <div class="card" style="cursor:default">${prompt}</div>
    <div class="choices">${q.ops.map((o,k)=>`<button class="ch ${q.t==='w2p'?'e':''}" data-k="${k}">${q.t==='w2p'?o.e:esc(o.w)}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <button class="b acc" id="nx" hidden>다음 문제 ▶</button></div>`;
  v.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
    if(Q.answered)return;Q.answered=true;
    const o=q.ops[+b.dataset.k],ok=o.id===x.id;
    v.querySelectorAll('.ch').forEach(c=>{if(q.ops[+c.dataset.k].id===x.id)c.classList.add('ok')});
    if(ok){Q.score++;}else{b.classList.add('ng');Q.wrong.push(x);status[x.id]='u';save();renderDays()}
    $('#fb').innerHTML=`${ok?'✅ 정답!':'❌ 아쉬워요'} <b style="font-family:var(--f-word)">${esc(x.w)}</b> = ${esc(x.m)}${q.t==='w2p'?`<br><span class="hint">${esc(x.c)}</span>`:''}`;
    speak(x.w);
    const n=$('#nx');n.hidden=false;n.focus();n.onclick=()=>{Q.i++;Q.answered=false;renderQuiz()};
  });
}

/* ---------- 전체 목록 ---------- */
function renderList(){
  const v=$('#view');
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
    <input class="search" id="q" type="search" placeholder="영어 단어나 뜻으로 검색 (예: 공존, launch)" value="${esc(S.q)}">
    <div class="list" id="lst"></div></div>`;
  const draw=()=>{
    const q=S.q.trim().toLowerCase();
    const r=(q?W:rangeOf(S.day)).filter(x=>!q||x.w.toLowerCase().includes(q)||x.m.includes(q)||x.c.includes(q));
    $('#lst').innerHTML=r.length?r.map(x=>`<div class="li" data-id="${x.id}"><div class="e">${x.e}</div><div class="t"><div class="w">${esc(x.w)}</div><div class="m">${esc(x.m)}${memo[x.id]?' · ✏️ 메모':''}</div></div><span class="dot ${status[x.id]||''}" title="${status[x.id]==='k'?'외움':status[x.id]==='u'?'다시 보기':'아직'}"></span></div>`).join(''):`<div class="empty">찾는 단어가 없어요</div>`;
  };
  draw();
  $('#q').oninput=e=>{S.q=e.target.value;draw()};
  $('#lst').onclick=e=>{const li=e.target.closest('[data-id]');if(!li)return;const id=+li.dataset.id;
    S.day=Math.floor(id/PER);S.onlyU=false;S.idx=id-S.day*PER;S.tab='study';revealed=true;save();
    document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==='study'));render();revealed=false};
}

function render(){renderDays();progress();if(S.tab==='study')renderStudy();else if(S.tab==='quiz')renderQuiz();else renderList()}
render();
</script>

</body>
</html>
