<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그림 단어장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 사전 표제어 한 항목을 크게 보여주는 단일 칼럼. 왼쪽(또는 위) 일러스트 패널 + 오른쪽 표제어·품사·뜻·예문 */
:root{
  --paper:#f5f6fa; --sheet:#ffffff; --ink:#141a2e; --muted:#5b6380; --line:#dde1ec;
  --accent:#2f4fd8; --accent-soft:#e6eafc; --accent-ink:#ffffff; --mark:#fff1c2; --mark-ink:#5a4300;
  --good:#1e8a5a; --bad:#c2410c;
  --f-head:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1220; --sheet:#161b2d; --ink:#e8ebf6; --muted:#9aa3c2; --line:#283050;
  --accent:#8ea2ff; --accent-soft:#1f2747; --accent-ink:#0e1220; --mark:#4a3d12; --mark-ink:#ffe7a3;
  --good:#5fd3a0; --bad:#ff9b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1220; --sheet:#161b2d; --ink:#e8ebf6; --muted:#9aa3c2; --line:#283050;
  --accent:#8ea2ff; --accent-soft:#1f2747; --accent-ink:#0e1220; --mark:#4a3d12; --mark-ink:#ffe7a3;
  --good:#5fd3a0; --bad:#ff9b6b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
svg.i{width:1em;height:1em;fill:currentColor;flex:none}
.wrap{max-width:860px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-head);font-weight:700;font-size:2.1rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.prog{min-width:180px;display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog b{color:var(--ink);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 11px;font-family:var(--f-body);font-size:.85rem;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .n{color:var(--muted);margin-left:5px;font-family:var(--f-mono);font-size:.75rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
button:focus-visible,input:focus-visible,textarea:focus-visible,.entry:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;font-family:var(--f-body);font-size:.84rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tog{display:flex;gap:6px;align-items:center;font-size:.84rem;color:var(--muted);cursor:pointer;margin-left:auto}

/* 사전 항목 */
.entry{background:var(--sheet);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);overflow:hidden;cursor:pointer}
.art{position:relative;aspect-ratio:1/1;max-width:100%;background:radial-gradient(120% 90% at 30% 20%,var(--sheet) 0%,var(--accent-soft) 70%);display:grid;place-items:center;border-right:1px solid var(--line)}
.art .main{width:62%;height:62%;color:var(--accent)}
.art .main svg{width:100%;height:100%;fill:currentColor}
.art .sub{position:absolute;right:9%;bottom:9%;width:25%;height:25%;border-radius:50%;background:var(--sheet);box-shadow:0 6px 18px -8px rgba(20,26,46,.35);display:grid;place-items:center;color:var(--ink);border:1px solid var(--line)}
.art .sub svg{width:58%;height:58%;fill:currentColor}
.art .no{position:absolute;left:14px;top:12px;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.body{padding:26px 28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hw-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hw{font-family:var(--f-head);font-weight:700;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.pos{font-family:var(--f-head);font-style:italic;font-size:1.05rem;color:var(--accent)}
.pos-ko{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.st{margin-left:auto;font-size:.75rem;padding:2px 10px;border-radius:99px;font-weight:500}
.st.k{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.st.u{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.def{font-size:1.15rem;font-weight:500;line-height:1.5}
.ex{border-left:3px solid var(--accent-soft);padding-left:14px;display:flex;flex-direction:column;gap:2px}
.ex .en{font-family:var(--f-head);font-size:1.12rem;line-height:1.45}
.ex .en mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}
.ex .ko{font-size:.9rem;color:var(--muted)}
.cover{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:.92rem;background:var(--paper)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:99px;padding:5px 12px;font-family:var(--f-body);font-size:.82rem;cursor:pointer}
.sbtn svg{font-size:1rem;color:var(--accent)}
.actions{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px}
.b{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:12px;padding:13px 14px;font-family:var(--f-body);font-weight:700;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.b svg{font-size:1.2rem}
.b.no{color:var(--bad)}
.b.yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.memo{display:flex;flex-direction:column;gap:6px}
.memo label{font-size:.85rem;color:var(--muted)}
textarea{width:100%;min-height:64px;font-family:var(--f-body);font-size:.95rem;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sheet);color:var(--ink);resize:vertical}
.hint{font-size:.8rem;color:var(--muted);text-align:center}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--sheet);border:1px solid var(--line);border-radius:18px}

/* 퀴즈 */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.qtop{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qart{display:grid;place-items:center;padding:26px;background:radial-gradient(120% 90% at 30% 20%,var(--sheet) 0%,var(--accent-soft) 70%)}
.qart .pair{position:relative;width:180px;height:180px;max-width:100%}
.qart .pair .main{position:absolute;inset:0;color:var(--accent)}
.qart .pair .main svg{width:100%;height:100%;fill:currentColor}
.qart .pair .sub{position:absolute;right:-6px;bottom:-6px;width:56px;height:56px;border-radius:50%;background:var(--sheet);border:1px solid var(--line);display:grid;place-items:center}
.qart .pair .sub svg{width:60%;height:60%;fill:currentColor}
.qtext{padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:6px}
.qtext .big{font-family:var(--f-head);font-weight:700;font-size:2.2rem;overflow-wrap:anywhere}
.qtext .sent{font-family:var(--f-head);font-size:1.3rem;line-height:1.5}
.qtext .sub2{color:var(--muted);font-size:.9rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:14px;padding:14px 12px;cursor:pointer;font-family:var(--f-head);font-weight:500;font-size:1.15rem;min-height:62px;overflow-wrap:anywhere;display:grid;place-items:center}
.ch.pic{min-height:110px}
.ch.pic .pair{position:relative;width:64px;height:64px;color:var(--accent)}
.ch.pic .pair svg{width:100%;height:100%;fill:currentColor}
.ch.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--sheet))}
.ch.ng{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--sheet))}
.fb{text-align:center;min-height:1.6em}
.fb .w{font-family:var(--f-head);font-weight:700}
.start{padding:32px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.start h2{font-family:var(--f-head);font-size:1.6rem;margin:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;width:100%;max-width:640px}
.mode{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;font-family:var(--f-body)}
.mode svg{font-size:1.8rem;color:var(--accent)}
.mode b{font-size:1rem}
.mode span{font-size:.82rem;color:var(--muted)}
.score{font-family:var(--f-head);font-weight:700;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}

/* 목록 */
.search{width:100%;font-size:1rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-family:var(--f-body)}
.list{background:var(--sheet);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .ic{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.li .ic svg{width:60%;height:60%;fill:currentColor}
.li .w{font-family:var(--f-head);font-weight:700;font-size:1.1rem}
.li .w i{font-weight:500;color:var(--accent);font-size:.9rem;margin-left:6px}
.li .m{font-size:.86rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.k{background:var(--good)}.dot.u{background:var(--bad)}
.credit{font-size:.75rem;color:var(--muted);text-align:center}

@media (max-width:640px){
  .entry{grid-template-columns:1fr}
  .art{border-right:0;border-bottom:1px solid var(--line);aspect-ratio:16/10}
  .art .main{width:44%;height:70%}
  .art .sub{width:18%;height:auto;aspect-ratio:1/1;right:22%}
  .body{padding:20px}
  .tog{margin-left:0}
  .b{padding:12px 10px;font-size:.95rem}
}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .22s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:4px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:.92rem;padding:8px 13px;cursor:pointer;border-radius:9px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
.qtext .sent .gap{display:inline-block;min-width:90px;height:1.1em;vertical-align:-.15em;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:6px;margin:0 4px}
.ex .en .gap{display:inline-block;min-width:70px;height:1em;vertical-align:-.1em;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:5px;margin:0 3px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-family:var(--f-head);font-size:1.45rem;margin:0;line-height:1.2}
.panel h3{font-size:1rem;margin:0}
.lead{color:var(--muted);font-size:.92rem;margin:0}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.88rem}
.notice b{color:var(--accent)}
.rank{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:28px 44px minmax(0,1fr) 74px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rk:first-child{border-top:0}
.rk .no{font-family:var(--f-mono);color:var(--muted);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.rk .ic{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.rk .ic svg{width:60%;height:60%;fill:currentColor}
.rk .w{font-family:var(--f-head);font-weight:700;font-size:1.05rem}
.rk .m{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.rk .meter i{display:block;height:100%;background:var(--bad)}
.rk .pct{text-align:right;font-variant-numeric:tabular-nums;font-size:.85rem}
.rk .pct b{display:block;font-size:1.05rem;color:var(--bad)}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start}
.sw button{border:0;background:none;color:var(--muted);padding:6px 12px;font-family:var(--f-body);font-size:.84rem;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tip{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--paper);min-width:0}
.tip .tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.tip p{margin:0;font-size:.9rem}
.fam{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:99px;padding:3px 10px;font-family:var(--f-head);font-size:.95rem;cursor:pointer}
.wchip small{font-family:var(--f-body);color:var(--muted);font-size:.72rem;margin-left:4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:.86rem}
.vs .mid{font-family:var(--f-mono);color:var(--muted);font-size:.75rem}
.post{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.post:first-child{border-top:0}
.post .meta{font-size:.76rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.post .txt{font-size:.94rem;white-space:pre-wrap;overflow-wrap:anywhere}
.post .reply{font-size:.86rem;background:var(--paper);border-radius:10px;padding:8px 12px;color:var(--ink)}
.badge{font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--ink)}
.badge.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.badge.doing{background:var(--accent-soft);color:var(--accent)}
.badge.cat{background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.form{display:flex;flex-direction:column;gap:10px}
.form .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.form input,.form select{width:100%;font-family:var(--f-body);font-size:.95rem;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--sheet);color:var(--ink)}
.form label{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.msg{font-size:.86rem;min-height:1.3em}
.msg.ok{color:var(--good)}.msg.err{color:var(--bad)}
.ctips{display:flex;flex-direction:column;gap:6px}
.ctips .t{font-size:.88rem;background:var(--paper);border-radius:10px;padding:8px 12px}
.ctips .t span{color:var(--muted);font-size:.75rem;margin-left:6px}
.memo-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small-b{border:1px solid var(--line);background:var(--sheet);color:var(--accent);border-radius:8px;padding:6px 12px;font-family:var(--f-body);font-size:.84rem;font-weight:700;cursor:pointer}
@media (max-width:640px){.form .row2{grid-template-columns:1fr}.rk{grid-template-columns:22px 40px minmax(0,1fr) 62px;gap:10px}.vs{grid-template-columns:1fr}.vs .mid{display:none}}
:root{--cA:#2f4fd8;--cB:#d97706}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cA:#6d83ee;--cB:#c47a12}}
:root[data-theme="dark"]{--cA:#6d83ee;--cB:#c47a12}
.eyebrow-s{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.panel h3 small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px}
.exp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.steps-intro{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.steps-intro b{display:block}
.form label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.9rem}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stepper li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;position:relative}
.stepper li:not(:last-child)::before{content:"";position:absolute;left:16px;top:44px;bottom:-4px;width:2px;background:var(--line)}
.stepper .dotn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.stepper .dotn svg{font-size:1rem}
.stepper li.done .dotn{background:var(--good);border-color:var(--good);color:var(--sheet)}
.stepper li.now .dotn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper .sbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.stepper .sbody span{font-size:.85rem;color:var(--muted)}
.stepper li.lock b{color:var(--muted)}
.b.sm{padding:8px 14px;font-size:.88rem;align-self:flex-start}
.lik{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.lik p{margin:0}
.likr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:360px}
.likr button{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:9px 0;font-family:var(--f-mono);cursor:pointer}
.likr button[aria-pressed="true"],.wchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.entry.is-plain{grid-template-columns:1fr}
.plain{padding:40px 24px 30px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;position:relative}
.plain .no{position:absolute;left:14px;top:12px;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.chart{margin:0;display:flex;flex-direction:column;gap:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i,.key{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.sw-A{background:var(--cA)}.sw-B{background:var(--cB)}
.cwrap{overflow-x:auto}
.cwrap svg{width:100%;min-width:420px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round}
.chart .pt{stroke:var(--sheet);stroke-width:2}
.chart .dl{font-size:12.5px;font-family:var(--f-body);fill:var(--ink);font-weight:500}
.s-A .ln{stroke:var(--cA)}.s-A .pt,.s-A-fill{fill:var(--cA)}
.s-B .ln{stroke:var(--cB)}.s-B .pt{fill:var(--cB)}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:center}
.hl{font-size:.86rem}
.hbs{display:flex;flex-direction:column;gap:3px}
.hbrow{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center}
.hbtrack{height:12px;background:var(--paper);border-radius:4px;overflow:hidden}
.hbtrack i{display:block;height:100%;border-radius:0 4px 4px 0}
.hv{font-family:var(--f-mono);font-size:.78rem;color:var(--ink);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--paper);min-width:0}
.kpi.wide{grid-column:span 1}
.kpi span{font-size:.78rem;color:var(--muted)}
.kpi b{font-family:var(--f-head);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi b small{font-size:.9rem;color:var(--muted);margin-left:2px;font-family:var(--f-body);font-weight:400}
.kpi em{font-style:normal;font-size:.78rem;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
thead th{border-top:0;background:var(--paper);color:var(--muted);font-weight:500;font-size:.78rem}
th:first-child,td:first-child{text-align:left}
.quotes{display:flex;flex-direction:column;gap:8px}
.quotes blockquote{margin:0;background:var(--paper);border-radius:10px;padding:10px 14px;font-size:.9rem}
.summary{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:12px;padding:14px 16px;font-size:.92rem}
.summary p{margin:0}
.limits{margin:0;padding-left:1.2em;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.notice.demo{background:color-mix(in srgb,var(--cB) 16%,var(--sheet))}
.notice.demo b{color:var(--ink)}
@media (max-width:640px){.hb{grid-template-columns:1fr;gap:6px}.kpi b{font-size:1.6rem}}
html.a-big{font-size:118%}
html.a-big body{font-size:18px}
html.a-cvd{--good:#0072b2;--bad:#d55e00}
@media (prefers-color-scheme: dark){html.a-cvd:not([data-theme="light"]){--good:#56b4e9;--bad:#e69f00}}
html.a-cvd[data-theme="dark"]{--good:#56b4e9;--bad:#e69f00}
.a11y-btn{align-self:flex-end;margin-top:4px}
.a11y{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:.9rem}
.a11y label{display:flex;gap:6px;align-items:center;cursor:pointer}
.like{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);border-radius:99px;padding:3px 10px;font-family:var(--f-body);font-size:.78rem;cursor:pointer;margin-top:4px}
.like svg{font-size:.9rem}
.like b{color:var(--ink);font-variant-numeric:tabular-nums}
.like[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.needs{border-color:var(--accent);border-width:1.5px}
.goal{display:flex;flex-direction:column;gap:8px}
.gbar{position:relative;height:16px;background:var(--paper);border:1px solid var(--line);border-radius:99px;overflow:visible}
.gbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.gbar .mk{position:absolute;top:-4px;width:2px;height:22px;background:var(--line);transform:translateX(-1px)}
.gbar .mk.on{background:var(--accent)}
.gbar .mk:last-child{display:none}
.gnum{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.gnum b{font-family:var(--f-head);font-size:1.6rem;color:var(--ink)}

.anon{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
.anoncode{display:flex;flex-direction:column;gap:4px;background:var(--accent-soft);border-radius:12px;padding:12px 16px}
.anoncode span{font-size:.8rem;color:var(--muted)}
.anoncode b{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.12em;color:var(--accent)}
.anoncode small{font-size:.8rem;color:var(--muted)}
details summary{cursor:pointer;font-size:.86rem;color:var(--accent)}
</style>

</head>

const STOP=new Set(['one','one’s',"one's",'to','the','of','a','an','on','in','up','by','as','into','with','at','for','from','off','down','out','over','its','it','be','is','v','ing','v-ing','to-v']);
function keyTokens(w){return w.toLowerCase().replace(/\(.*?\)|\[.*?\]|[…~·.]/g,' ').split(/\s+/).filter(t=>t&&!STOP.has(t)&&/[a-z]/.test(t))}
function stem(t){if(t.length<=4)return t;return t.replace(/(ies|ied|ing|ed|es|s|e|y)$/,'').slice(0,Math.max(4,t.length-3))}
function markSentence(x){const toks=keyTokens(x.w).map(stem);return esc(x.en).replace(/[A-Za-z'’-]+/g,m=>{const l=m.toLowerCase();return toks.some(s=>l.startsWith(s))?`<mark>${m}</mark>`:m})}
function blankSentence(x){const toks=keyTokens(x.w).map(stem);let hit=0;
  const out=esc(x.en).replace(/[A-Za-z'’-]+/g,m=>{const l=m.toLowerCase();if(toks.some(s=>l.startsWith(s))){hit++;return '<span class="gap"></span>'}return m});
  return hit?out.replace(/(<span class="gap"><\/span>)(\s*<span class="gap"><\/span>)+/g,'$1'):null}

/* ---------- 범위 ---------- */
function hardList(){
  const src=SV.loaded&&S.rankBy==='all'?Object.entries(SV.stats).map(([id,[t,w]])=>({id:+id,t,w})):Object.entries(myMiss).map(([id,w])=>({id:+id,t:w,w}));
  return src.filter(r=>W[r.id]&&r.w>0&&!expHide(r.id)).sort((a,b)=>b.w-a.w||(b.w/b.t)-(a.w/a.t)).slice(0,30);
}
function rangeOf(d){let r;if(d==='all')r=W;else if(d==='review')r=W.filter(x=>status[x.id]==='u');else if(d==='hard')r=hardList().map(r=>W[r.id]);else r=W.slice(d*PER,(d+1)*PER);return r.filter(x=>!expHide(x.id))}
function pool(){let r=rangeOf(S.day);if(S.onlyU&&!['review','hard'].includes(S.day))r=r.filter(x=>status[x.id]!=='k');return r}
function save(){store.set('status',status);store.set('day',S.day==='hard'?0:S.day);store.set('hide',S.hide);progress()}
function progress(){const k=Object.values(status).filter(v=>v==='k').length;$('#pk').textContent=k;$('#pb').style.width=(k/W.length*100)+'%'}
function speak(t){try{const u=new SpeechSynthesisUtterance(t.replace(/[~…·\[\]]/g,' ').replace(/\s+/g,' '));u.lang='en-US';u.rate=(typeof A11Y!=='undefined'&&A11Y.slow)?.62:.88;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function art(x,num){const [a,b]=x.ic;return `<div class="art">${num?`<span class="no">${num}</span>`:''}<div class="main">${ico(a)}</div>${b?`<div class="sub">${ico(b)}</div>`:''}</div>`}
function fmtDate(s){try{const d=new Date(s);return `${d.getMonth()+1}월 ${d.getDate()}일`}catch(e){return ''}}
function goWord(id){S.day=Math.floor(id/PER);S.onlyU=false;S.idx=id-S.day*PER;S.tab='study';revealed=true;save();setTabs();render();revealed=false;window.scrollTo({top:0})}

function renderDays(){
  const show=['study','quiz','list'].includes(S.tab);$('#days').hidden=!show;if(!show)return;
  let h='';
  for(let d=0;d<NDAY;d++){const r=rangeOf(d),k=r.filter(x=>status[x.id]==='k').length;h+=`<button class="chip" aria-pressed="${S.day===d}" data-day="${d}">Day ${d+1}<span class="n">${k}/${r.length}</span></button>`}
  h+=`<button class="chip" aria-pressed="${S.day==='review'}" data-day="review">다시 볼 단어<span class="n">${W.filter(x=>status[x.id]==='u').length}</span></button>`;
  if(S.day==='hard')h+=`<button class="chip" aria-pressed="true" data-day="hard">많이 틀린 단어<span class="n">${rangeOf('hard').length}</span></button>`;
  h+=`<button class="chip" aria-pressed="${S.day==='all'}" data-day="all">전체<span class="n">${W.length}</span></button>`;
  $('#days').innerHTML=h;
}
$('#days').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;const v=b.dataset.day;S.day=['all','review','hard'].includes(v)?v:+v;S.idx=0;S.quiz=null;revealed=false;save();render()});
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.quiz=null;setTabs();render();if(['rank','tips','board','class'].includes(S.tab)&&Date.now()-lastLoad>20000){flush();setTimeout(loadShared,1500)}});
function setTabs(){document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===S.tab))}

/* ---------- 단어 카드 ---------- */
function wordTips(id){return SV.tips.filter(t=>t.id===id).slice(-3).reverse()}
function renderStudy(){
  const P=pool(),v=$('#view');
  const opts=`<div class="opts"><div class="seg" role="group" aria-label="가리기">
    <button data-hide="mean" aria-pressed="${S.hide==='mean'}">뜻 가리기</button>
    <button data-hide="word" aria-pressed="${S.hide==='word'}">단어 가리기</button>
    <button data-hide="none" aria-pressed="${S.hide==='none'}">모두 보기</button></div>
    ${['review','hard'].includes(S.day)?'':`<label class="tog"><input type="checkbox" id="onlyU" ${S.onlyU?'checked':''}> 외운 단어 숨기기</label>`}</div>`;
  if(!P.length){v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${opts}<div class="empty">${S.day==='review'?'다시 볼 단어가 없어요. 카드에서 "몰라요"를 누르거나 퀴즈에서 틀린 단어가 여기에 모여요.':S.day==='hard'?'아직 틀린 기록이 없어요.':'이 범위의 단어를 모두 외웠어요. "외운 단어 숨기기"를 끄면 다시 볼 수 있어요.'}</div></div>`;bindOpts();return}
  if(S.idx>=P.length)S.idx=0;
  const x=P[S.idx],st=status[x.id],hw=S.hide==='word'&&!revealed,hm=S.hide==='mean'&&!revealed,p=POS[x.pos];
  const st2=SV.stats[x.id];const ct=wordTips(x.id);
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${opts}
  <article class="entry fade" id="card" tabindex="0" aria-label="눌러서 정답 확인">
    ${art(x,`${String(x.id+1).padStart(3,'0')} · ${S.idx+1}/${P.length}`)}
    <div class="body">
      <div class="hw-row">
        ${hw?`<span class="hw" style="color:var(--muted)">? ? ?</span>`:`<span class="hw">${esc(x.w)}</span>`}
        <span class="pos">${p[0]}</span><span class="pos-ko">${p[1]}</span>
        ${st?`<span class="st ${st}">${st==='k'?'외웠어요':'다시 보기'}</span>`:''}
      </div>
      ${hm?`<div class="cover">그림과 예문을 보고 뜻을 떠올린 뒤 카드를 눌러 확인하세요</div>`:`<div class="def">${esc(x.m)}</div>`}
      <div class="ex"><div class="en">${hw?blankSentence(x)||esc(x.en):markSentence(x)}</div>${hm?'':`<div class="ko">${esc(x.ko)}</div>`}</div>
      ${hw?`<div class="cover">빈칸과 그림에 맞는 단어를 떠올린 뒤 카드를 눌러 확인하세요</div>`:''}
      <div class="tools">
        <button class="sbtn" id="sw">${ui('speak')} 단어 듣기</button>
        <button class="sbtn" id="se">${ui('speak')} 예문 듣기</button>
        ${st2&&st2[0]>=3?`<span class="sbtn" style="cursor:default;color:var(--bad)">친구들 오답률 ${Math.round(st2[1]/st2[0]*100)}%</span>`:''}
      </div>
    </div>
  </article>
  <div class="actions">
    <button class="b" id="prev" aria-label="이전 단어">${ui('prev')}</button>
    <button class="b no" id="no">${ui('x')} 몰라요</button>
    <button class="b yes" id="yes">${ui('check')} 외웠어요</button>
    <button class="b" id="next" aria-label="다음 단어">${ui('next')}</button>
  </div>
  <div class="memo"><label for="memoBox">나만의 연상 메모</label>
  <textarea id="memoBox" maxlength="300" placeholder="그림을 보고 떠오른 장면이나 소리 연상을 적어 두면 더 오래 기억나요">${esc(memo[x.id]||'')}</textarea>
  ${SV.on?`<div class="memo-row"><button class="small-b" id="shareTip">이 메모를 친구들과 팁으로 공유</button><span class="msg" id="tipMsg"></span></div>`:''}
  ${ct.length&&!(hm||hw)?`<div class="ctips"><h3 style="font-size:.85rem;color:var(--muted);font-weight:500;margin:6px 0 0">친구들의 암기 팁</h3>${ct.map(t=>`<div class="t">${esc(t.text)} ${likeBtn(t)}</div>`).join('')}</div>`:''}
  </div>
  <p class="hint">키보드: Space 뒤집기 · ← → 이동 · 1 몰라요 · 2 외웠어요</p></div>`;
  bindOpts();
  $('#card').onclick=e=>{if(e.target.closest('.sbtn'))return;revealed=!revealed;renderStudy()};
  $('#sw').onclick=()=>speak(x.w);$('#se').onclick=()=>speak(x.en);
  $('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
  $('#no').onclick=()=>mark('u');$('#yes').onclick=()=>mark('k');
  $('#memoBox').oninput=e=>{const t=e.target.value;if(t.trim())memo[x.id]=t;else delete memo[x.id];store.set('memo',memo)};
  const sh=$('#shareTip');if(sh)sh.onclick=()=>shareTip(x,$('#memoBox').value,$('#tipMsg'));

let lastPost=0;
async function shareTip(x,text,msg){
  text=(text||'').trim();
  if(text.length<4){msg.className='msg err';msg.textContent='팁을 4글자 이상 적어 주세요.';return}
  if(Date.now()-lastPost<8000){msg.className='msg err';msg.textContent='잠시 후 다시 올려 주세요.';return}
  lastPost=Date.now();
  await send({type:'tip',id:x?x.id:'',word:x?x.w:'',text});
  SV.tips.push({id:x?x.id:null,word:x?x.w:'',text,time:new Date().toISOString()});
  msg.className='msg ok';msg.textContent='공유했어요. 친구들 화면에는 잠시 뒤 나타나요.';
}
function bindOpts(){document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{S.hide=b.dataset.hide;revealed=false;save();renderStudy()});const o=$('#onlyU');if(o)o.onchange=()=>{S.onlyU=o.checked;S.idx=0;renderStudy()}}
function move(d){const n=pool().length;if(!n)return;S.idx=(S.idx+d+n)%n;revealed=false;renderStudy()}
function mark(v){const P=pool(),x=P[S.idx];if(!x)return;status[x.id]=v;logAnswer(x,v==='k','card');save();renderDays();revealed=false;
  const gone=(S.onlyU&&v==='k')||(S.day==='review'&&v==='k');if(!gone)S.idx=(S.idx+1)%P.length;renderStudy()}
document.addEventListener('keydown',e=>{if(S.tab!=='study'||e.target.matches('textarea,input,select'))return;
  if(e.key===' '){e.preventDefault();revealed=!revealed;renderStudy()}else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);else if(e.key==='1')mark('u');else if(e.key==='2')mark('k')});

/* ---------- 퀴즈 ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const MODES=[['p2w','image','그림 → 단어','그림만 보고 단어 고르기'],['w2p','eye','단어 → 그림','단어를 보고 맞는 그림 고르기'],['blank','text-aa','예문 빈칸','예문 속 빈칸에 들어갈 단어'],['k2w','translate','뜻 → 단어','한국어 뜻을 보고 영어 고르기']];
function newQuiz(type){
  let P=rangeOf(S.day);if(type==='blank')P=P.filter(x=>blankSentence(x));if(!P.length)return null;
  const qs=shuffle(P).slice(0,Math.min(10,P.length)).map(x=>{const near=W.filter(y=>y.id!==x.id&&Math.abs(y.id-x.id)<45&&y.ic[0]!==x.ic[0]);return{x,ops:shuffle([x,...shuffle(near).slice(0,3)])}});
  return{qs,i:0,score:0,wrong:[],done:false,type};
}
function pair(x){const[a,b]=x.ic;return `<div class="pair"><div class="main">${ico(a)}</div>${b?`<div class="sub">${ico(b)}</div>`:''}</div>`}
function renderQuiz(){
  const v=$('#view');
  if(!S.quiz){const n=rangeOf(S.day).length;
    v.innerHTML=`<div class="qcard"><div class="start"><h2>${n?`${S.day==='hard'?'많이 틀린 단어에서 ':'이 범위에서 '}${Math.min(10,n)}문제`:'풀 수 있는 단어가 없어요'}</h2>
    ${n?`<p class="hint" style="margin:0">틀린 단어는 자동으로 "다시 볼 단어"에 들어가요</p><div class="modes">${MODES.map(m=>`<button class="mode" data-q="${m[0]}">${ico(m[1])}<b>${m[2]}</b><span>${m[3]}</span></button>`).join('')}</div>`:''}</div></div>`;
    v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.quiz=newQuiz(b.dataset.q);renderQuiz()});return}
  const Q=S.quiz;
  if(Q.i>=Q.qs.length){flush();const r=Q.score/Q.qs.length;
    v.innerHTML=`<div class="qcard"><div class="start"><div class="score">${Q.score}<span style="font-size:1.6rem;color:var(--muted)"> / ${Q.qs.length}</span></div>
    <h2 style="font-size:1.2rem">${r===1?'모두 맞혔어요':r>=.7?'잘했어요. 틀린 단어만 다시 확인해 보세요':'"다시 볼 단어"로 한 번 더 복습해 보세요'}</h2>
    ${Q.wrong.length?`<div class="list" style="width:100%;text-align:left">${Q.wrong.map(x=>`<div class="li" data-go="${x.id}"><div class="ic">${ico(x.ic[0])}</div><div style="min-width:0"><div class="w">${esc(x.w)}<i>${POS[x.pos][0]}</i></div><div class="m">${esc(x.m)}</div></div><span></span></div>`).join('')}</div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="b yes" id="again">다시 풀기</button><button class="b" id="back">유형 고르기</button></div></div></div>`;
    v.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>goWord(+el.dataset.go));
    $('#again').onclick=()=>{S.quiz=newQuiz(Q.type);renderQuiz()};$('#back').onclick=()=>{S.quiz=null;renderQuiz()};return}
  const q=Q.qs[Q.i],x=q.x,t=Q.type;let prompt;
  if(t==='p2w')prompt=`<div class="qart">${pair(x)}</div>`;
  else if(t==='w2p')prompt=`<div class="qtext"><div class="big">${esc(x.w)}</div><div class="sub2">이 단어에 맞는 그림은?</div></div>`;
  else if(t==='blank')prompt=`<div class="qtext"><div class="sent">${blankSentence(x)}</div><div class="sub2">${esc(x.ko)}</div></div>`;
  else prompt=`<div class="qtext"><div class="big" style="font-family:var(--f-body);font-size:1.5rem">${esc(x.m)}</div><div class="sub2">${POS[x.pos][1]}</div></div>`;
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><div class="qtop"><span>Q ${Q.i+1} / ${Q.qs.length}</span><span>정답 ${Q.score}</span></div>
    <div class="qcard fade">${prompt}</div>
    <div class="choices">${q.ops.map((o,k)=>`<button class="ch ${t==='w2p'?'pic':''}" data-k="${k}">${t==='w2p'?pair(o):esc(o.w)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div><button class="b yes" id="nx" hidden>다음 문제 ${ui('next')}</button></div>`;
  v.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
    if(Q.done)return;Q.done=true;const o=q.ops[+b.dataset.k],ok=o.id===x.id;
    v.querySelectorAll('.ch').forEach(c=>{if(q.ops[+c.dataset.k].id===x.id)c.classList.add('ok')});
    if(ok)Q.score++;else{b.classList.add('ng');Q.wrong.push(x);status[x.id]='u';save();renderDays()}
    logAnswer(x,ok,t);
    $('#fb').innerHTML=`${ok?'정답입니다.':'아쉬워요.'} <span class="w">${esc(x.w)}</span> ${esc(x.m)}<br><span class="hint">${esc(x.en)}</span>`;
    speak(x.w);const n=$('#nx');n.hidden=false;n.focus();n.onclick=()=>{Q.i++;Q.done=false;renderQuiz()};
  });
}

const FAM=[

  ['밖으로 ex- / e-',['excavate','expel','exploit','externalize','evade','erosion']],
  ['아래 sub- (sup-)',['subset','subsidiary','subsidize','subscribe','substandard','suppress']],
  ['함께 com- / con- / co-',['collaboration','cohesive','converge','congruent','compile','compress']],
  ['슬픔과 고통',['anguish','grieve','mourn','torment','weep','wail']],
  ['몸과 의학',['artery','kidney','tumor','ulcer','diabetes','asthma','autopsy','prescribe']]
];

const DAY=86400000;
const XIDS=EXP.setX.map(w=>BY[w.toLowerCase()]).filter(Boolean).map(x=>x.id);
const YIDS=EXP.setY.map(w=>BY[w.toLowerCase()]).filter(Boolean).map(x=>x.id);

const XSET=new Set(XIDS);

function makeCode(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const a=new Uint32Array(6);(window.crypto||{getRandomValues:x=>x.map(()=>Math.random()*4e9)}).getRandomValues(a);for(let i=0;i<5;i++)s+=ch[a[i]%ch.length];return s+'23456789'[a[5]%8]}
const PHASES=[['pre','사전 시험'],['post','사후 시험'],['delay','1주 뒤 시험']];

function groupOf(pid){const m=pid.match(/(\d)(?!.*\d)/);if(m)return (+m[1])%2===1?1:2;let h=0;for(const c of pid)h=(h*31+c.charCodeAt(0))>>>0;return h%2?1:2}
function condOf(id,g){g=g||(ex&&ex.group);if(!EXPSET.has(id))return null;const inX=XSET.has(id);return (g===1)===inX?'A':'B'}
function expHide(id){return !!(ex&&ex.pid&&!ex.delayAt&&EXPSET.has(id))}
function hashStr(s){let h=1779033703;for(const c of s){h=Math.imul(h^c.charCodeAt(0),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){let a=hashStr(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuffle(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function dayIdx(){return ex&&ex.preAt?Math.floor((Date.now()-ex.preAt)/DAY)+1:0}
function openAt(ph){
  if(!ex)return Infinity;
  if(ph==='post'){if(!ex.preAt)return Infinity;return EXP.postOpenDate?new Date(EXP.postOpenDate+'T00:00').getTime():ex.preAt+EXP.studyDays*DAY}
  if(ph==='delay'){if(!ex.postAt)return Infinity;return EXP.delayOpenDate?new Date(EXP.delayOpenDate+'T00:00').getTime():ex.postAt+EXP.delayDays*DAY}
  return 0;
}
const fmtD=t=>{const d=new Date(t);return `${d.getMonth()+1}월 ${d.getDate()}일`};
function short(m){return m.split(/;/)[0].trim()}

/* 시험 문항: 단어마다 보기를 고정(같은 품사 오답 3개)해서 세 번의 시험을 똑같은 난이도로 */
function testItem(id,phase){
  const x=W[id];const r=rng('opt'+id);
  const same=W.filter(y=>y.id!==id&&y.pos===x.pos&&short(y.m)!==short(x.m));
  const pool=(same.length>=3?same:W.filter(y=>y.id!==id));
  const ds=[];const used=new Set();while(ds.length<3){const y=pool[Math.floor(r()*pool.length)];if(!used.has(y.id)){used.add(y.id);ds.push(y)}}
  const opts=sshuffle([x,...ds],'ord'+id+phase).map(y=>({id:y.id,t:short(y.m)}));
  return{id,opts};
}

/* ---------- 그래프 (SVG) ---------- */
function lineChart(series,xl,ytitle,opt={}){
  const w=600,h=300,m={l:48,r:118,t:20,b:44},iw=w-m.l-m.r,ih=h-m.t-m.b;const ymax=opt.ymax||100;
  const X=i=>m.l+(xl.length===1?iw/2:i*iw/(xl.length-1)),Y=v=>m.t+ih-(v/ymax)*ih;
  let g='';for(let t=0;t<=ymax;t+=ymax/4){g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(t)}" y2="${Y(t)}" class="grid"/><text x="${m.l-8}" y="${Y(t)+4}" class="tick" text-anchor="end">${Math.round(t)}</text>`}
  g+=xl.map((l,i)=>`<text x="${X(i)}" y="${h-m.b+22}" class="tick" text-anchor="middle">${esc(l)}</text>`).join('');
  const lines=series.map(s=>{const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v),v,i]).filter(Boolean);if(!pts.length)return'';const last=pts[pts.length-1];
    return `<g class="s-${s.c}"><polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" class="ln"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" class="pt"><title>${esc(s.name)} · ${esc(xl[p[3]])}: ${p[2]}${opt.unit??'%'}</title></circle>`).join('')}
      <text x="${last[0]+10}" y="${last[1]+4}" class="dl">${esc(s.name)} ${last[2]}${opt.unit??'%'}</text></g>`}).join('');
  return `<figure class="chart"><div class="legend">${series.map(s=>`<span><i class="sw-${s.c}"></i>${esc(s.name)}</span>`).join('')}</div>
   <div class="cwrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(ytitle)}">${g}${lines}<text x="12" y="${m.t+ih/2}" class="tick" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(ytitle)}</text></svg></div></figure>`;
}
function barPairs(rows,names,opt={}){ /* rows: [{label, a, b}] 가로 막대 두 개씩 */
  const max=opt.max||Math.max(1,...rows.flatMap(r=>[r.a||0,r.b||0]));
  return `<figure class="chart">${names?`<div class="legend">${names.map((n,i)=>`<span><i class="sw-${i?'B':'A'}"></i>${esc(n)}</span>`).join('')}</div>`:''}
   <div class="hbars">${rows.map(r=>`<div class="hb"><span class="hl">${esc(r.label)}</span><div class="hbs">
     ${[['a','A'],['b','B']].filter(([k])=>r[k]!=null).map(([k,c])=>`<div class="hbrow"><div class="hbtrack"><i class="sw-${c}" style="width:${(r[k]/max*100).toFixed(1)}%"></i></div><span class="hv">${opt.fmt?opt.fmt(r[k]):r[k]}</span></div>`).join('')}</div></div>`).join('')}</div></figure>`;
}
function scatter(pts,xt,yt){
  const w=600,h=300,m={l:52,r:20,t:16,b:48},iw=w-m.l-m.r,ih=h-m.t-m.b;
  const xmax=Math.max(10,...pts.map(p=>p.x))*1.05,ymin=Math.min(0,...pts.map(p=>p.y)),ymax=Math.max(10,...pts.map(p=>p.y));
  const X=v=>m.l+v/xmax*iw,Y=v=>m.t+ih-(v-ymin)/(ymax-ymin)*ih;
  let g='';for(let i=0;i<=4;i++){const v=ymin+(ymax-ymin)*i/4;g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${m.l-8}" y="${Y(v)+4}" class="tick" text-anchor="end">${Math.round(v)}</text>`;
    const xv=xmax*i/4;g+=`<text x="${X(xv)}" y="${h-m.b+20}" class="tick" text-anchor="middle">${Math.round(xv)}</text>`}
  return `<figure class="chart"><div class="cwrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(yt)}">${g}
   ${pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" class="pt s-A-fill"><title>${esc(p.l)} · ${Math.round(p.x)}분, ${p.y>=0?'+':''}${Math.round(p.y)}%p</title></circle>`).join('')}
   <text x="${m.l+iw/2}" y="${h-6}" class="tick" text-anchor="middle">${esc(xt)}</text><text x="12" y="${m.t+ih/2}" class="tick" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(yt)}</text></svg></div></figure>`;
}

/* ---------- 통계 ---------- */
const mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:NaN;
const sdev=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;
  for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break}return h}
function lgamma(z){const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-lgamma(1-z);z-=1;let x=c[0];for(let i=1;i<g+2;i++)x+=c[i]/(z+i);const t=z+g+0.5;return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x)}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
function pairedT(d){const n=d.length;if(n<2)return null;const m=mean(d),s=sdev(d);if(!(s>0))return{n,m,s:0,t:Infinity,p:m===0?1:0,dz:Infinity,pos:d.filter(v=>v>0).length};
  const t=m/(s/Math.sqrt(n)),df=n-1,p=ibeta(df/(df+t*t),df/2,.5);return{n,m,s,t,p,dz:m/s,pos:d.filter(v=>v>0).length,neg:d.filter(v=>v<0).length}}
function corr(xs,ys){const n=xs.length;if(n<3)return NaN;const mx=mean(xs),my=mean(ys);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(xs[i]-mx)*(ys[i]-my);b+=(xs[i]-mx)**2;c+=(ys[i]-my)**2}return a/Math.sqrt(b*c)}
const f1=v=>isFinite(v)?(Math.round(v*10)/10).toFixed(1):'-';
const pfmt=p=>p==null||!isFinite(p)?'-':p<.001?'p < .001':'p = '+p.toFixed(3).replace(/^0/,'');
function effWord(dz){const a=Math.abs(dz);return !isFinite(a)?'':a<.2?'거의 없음':a<.5?'작은 효과':a<.8?'중간 효과':'큰 효과'}

function sc(p,ph,c){const s=(p.scores[ph]||{})[c];return s&&s[1]?s[0]/s[1]*100:null}
function analysisHTML(d,demo){
  const P=d.participants||[];
  const n={join:P.length,pre:P.filter(p=>p.preAt).length,post:P.filter(p=>p.postAt).length,delay:P.filter(p=>p.delayAt).length};
  const C=P.filter(p=>p.preAt&&p.postAt&&p.delayAt);const base=C.length>=2?C:P.filter(p=>p.preAt&&p.postAt);
  const ph3=PHASES.map(p=>p[0]);
  const avg=(set,ph,c)=>{const a=set.map(p=>sc(p,ph,c)).filter(v=>v!=null);return a.length?Math.round(mean(a)):null};
  const ser=['A','B'].map(c=>({name:COND[c],c,vals:ph3.map(ph=>avg(base,ph,c))}));
  const gainD=C.map(p=>(sc(p,'delay','A')-sc(p,'pre','A'))-(sc(p,'delay','B')-sc(p,'pre','B')));
  const delayD=C.map(p=>sc(p,'delay','A')-sc(p,'delay','B'));
  const tG=pairedT(gainD),tD=pairedT(delayD);
  const PC=P.filter(p=>p.preAt&&p.postAt);const postG=PC.map(p=>(sc(p,'post','A')-sc(p,'pre','A'))-(sc(p,'post','B')-sc(p,'pre','B')));const tP=pairedT(postG);
  const ret=c=>{const a=C.map(p=>{const g=sc(p,'post',c)-sc(p,'pre',c);return g>0?(sc(p,'delay',c)-sc(p,'pre',c))/g*100:null}).filter(v=>v!=null);return a.length?Math.round(mean(a)):null};
  // 설문
  const SV2=P.filter(p=>p.sv&&p.sv.pre&&p.sv.post);
  const svRows=SQ_PRE.map(([k,t])=>({label:t,a:SV2.length?+mean(SV2.map(p=>+p.sv.pre[k])).toFixed(2):null,b:SV2.length?+mean(SV2.map(p=>+p.sv.post[k])).toFixed(2):null}));
  const postOnly=P.filter(p=>p.sv&&p.sv.post);
  const q567=SQ_POST.slice(4).map(([k,t])=>({label:t,a:postOnly.length?+mean(postOnly.map(p=>+p.sv.post[k])).toFixed(2):null}));
  const feat={};postOnly.forEach(p=>String(p.sv.post.feat||'').split('|').filter(Boolean).forEach(f=>feat[f]=(feat[f]||0)+1));
  const featRows=Object.entries(feat).sort((a,b)=>b[1]-a[1]).map(([f,c])=>({label:f,a:c}));
  const texts=postOnly.map(p=>String(p.sv.post.text||'').trim()).filter(Boolean);
  // 사용
  const U=P.filter(p=>p.preAt);const minA=U.map(p=>(p.study?.A||0)/60000),minB=U.map(p=>(p.study?.B||0)/60000);
  const days=U.map(p=>p.days||0);
  const scat=PC.map(p=>({l:p.pid,x:((p.study?.A||0)+(p.study?.B||0))/60000,y:(sc(p,'post','A')+sc(p,'post','B'))/2-(sc(p,'pre','A')+sc(p,'pre','B'))/2}));
  const r=corr(scat.map(s=>s.x),scat.map(s=>s.y));
  const maxDay=Math.min(EXP.studyDays,Math.max(0,...P.flatMap(p=>Object.keys(p.prac||{}).map(Number))));
  const curve=['A','B'].map(c=>({name:COND[c],c,vals:Array.from({length:maxDay},(_,i)=>{let ok=0,t=0;P.forEach(p=>{const s=(p.prac||{})[i+1];if(s&&s[c]){ok+=s[c][0];t+=s[c][1]}});return t?Math.round(ok/t*100):null})}));
  const cm=d.community||{};
  const mA=avg(base,'delay','A'),mB=avg(base,'delay','B');
  const sum=[];
  if(n.join)sum.push(`효과 실험에 참여한 학생 ${n.join}명 가운데 사전 시험 ${n.pre}명, 사후 시험 ${n.post}명, ${EXP.delayDays}일 뒤 시험 ${n.delay}명이 참여했다.`);
  if(C.length)sum.push(`세 번의 시험을 모두 마친 ${C.length}명을 분석한 결과, ${EXP.delayDays}일 뒤 정답률은 그림·예문 방식 단어가 평균 ${mA}%, 기본 방식 단어가 평균 ${mB}%였다.`);
  if(tG)sum.push(`사전 시험 대비 향상 폭은 그림·예문 방식이 기본 방식보다 평균 ${f1(tG.m)}%p ${tG.m>=0?'컸다':'작았다'} (대응표본 t검정 t(${tG.n-1}) = ${f1(tG.t)}, ${pfmt(tG.p)}, 효과 크기 dz = ${f1(tG.dz)}, ${effWord(tG.dz)}). 학생 ${tG.n}명 중 ${tG.pos}명은 그림·예문 단어에서 더 많이 향상되었다.`);
  if(ret('A')!=null&&ret('B')!=null)sum.push(`사후 시험에서 늘어난 점수가 ${EXP.delayDays}일 뒤까지 유지된 비율은 그림·예문 방식 ${ret('A')}%, 기본 방식 ${ret('B')}%였다.`);
  if(U.length)sum.push(`공부 시간은 1인 평균 그림·예문 단어 ${f1(mean(minA))}분, 기본 단어 ${f1(mean(minB))}분으로 ${Math.abs(mean(minA)-mean(minB))<Math.max(2,mean(minA)*.2)?'비슷해, 차이가 공부 시간 때문이라고 보기 어렵다':'차이가 있어 해석에 주의가 필요하다'}.`);
  if(SV2.length)sum.push(`설문에서 "외운 단어가 오래 기억에 남는다"는 응답은 5점 만점에 ${svRows[2].a}점에서 ${svRows[2].b}점으로, "단어 공부가 재미있다"는 ${svRows[1].a}점에서 ${svRows[1].b}점으로 변했다.`);
  if(featRows.length)sum.push(`가장 도움이 된 기능으로 많이 꼽힌 것은 ${featRows.slice(0,2).map(f=>`"${f.label}"(${f.a}명)`).join(', ')}였다.`);
  if(isFinite(r))sum.push(`공부 시간과 점수 향상의 상관계수는 r = ${f1(r)}였다.`);
  if(cm.tips!=null)sum.push(`학생들이 서로 공유한 암기 팁은 ${cm.tips}개였고, 다른 학생이 "도움됐어요"를 누른 횟수는 ${cm.likes}번이었다. 반 전체가 함께 쌓은 학습은 ${(cm.studyCount||0).toLocaleString()}번으로 협동 목표의 ${Math.min(100,Math.round((cm.studyCount||0)/COOP.goal*100))}%를 채웠다.`);
  if(cm.requests!=null)sum.push(`요청 게시판에 올라온 의견 ${cm.requests}개 중 ${cm.done}개를 앱에 반영했${cm.avgReplyDays!=null?`고, 반영까지 평균 ${f1(cm.avgReplyDays)}일이 걸렸`:''}다.`);
  if(cm.needsN)sum.push(`처음 사용할 때 ${cm.needsN}명에게 단어 공부의 어려움을 물었더니 ${Object.entries(cm.needs||{}).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>`"${k}"(${v}명)`).join(', ')} 순으로 많았다.`);
  if(cm.a11yOn)sum.push(`큰 글씨·색각 배려 색·느린 발음 같은 배려 모드는 ${cm.a11yOn}번 켜졌다.`);
  return `<div style="display:flex;flex-direction:column;gap:16px">
  ${demo?`<div class="notice demo"><span><b>예시 데이터</b> 실제 기록이 아니라 결과 화면을 미리 보기 위한 가짜 데이터예요. 보고서에 쓰지 마세요.</span></div>`:''}
  <div class="panel"><div class="exp-head"><div><span class="eyebrow-s">효과 실험 결과</span><h2>그림·예문 방식은 단어 기억에 효과가 있었나</h2></div><button class="small-b" id="aclose">닫기</button></div>
   <div class="kpis">${[['참여',n.join],['사전 시험',n.pre],['사후 시험',n.post],[`${EXP.delayDays}일 뒤 시험`,n.delay]].map(([l,v])=>`<div class="kpi"><span>${l}</span><b>${v}<small>명</small></b></div>`).join('')}</div>
  </div>
  <div class="panel"><h3>시험 정답률 변화 <small>${base===C?`세 시험 모두 본 ${C.length}명`:`사전·사후를 본 ${base.length}명`} 평균</small></h3>${lineChart(ser,PHASES.map(p=>p[1]),'정답률 (%)')}
   <div class="tablewrap"><table><thead><tr><th>방식</th>${PHASES.map(p=>`<th>${p[1]}</th>`).join('')}<th>${EXP.delayDays}일 뒤 유지율</th></tr></thead><tbody>${ser.map(s=>`<tr><td><i class="sw-${s.c} key"></i>${s.name}</td>${s.vals.map(v=>`<td>${v??'-'}${v!=null?'%':''}</td>`).join('')}<td>${ret(s.c)??'-'}${ret(s.c)!=null?'%':''}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><h3>같은 학생 안에서 두 방식 비교 <small>그림·예문 향상 폭 − 기본 향상 폭</small></h3>
   <div class="kpis">${[[`사후 시험 기준`,tP],[`${EXP.delayDays}일 뒤 기준`,tG]].map(([l,t])=>`<div class="kpi wide"><span>${l}</span>${t?`<b>${t.m>=0?'+':''}${f1(t.m)}<small>%p</small></b><em>${pfmt(t.p)} · dz ${f1(t.dz)} (${effWord(t.dz)}) · ${t.pos}/${t.n}명이 그림 쪽 향상 더 큼</em>`:'<b>-</b><em>2명 이상 완료하면 계산돼요</em>'}</div>`).join('')}</div>
   <p class="lead">p가 .05보다 작으면 "우연으로 보기 어려운 차이"로 해석해요. dz는 0.2 작은 효과, 0.5 중간, 0.8 큰 효과가 기준이에요. 같은 학생이 두 방식을 모두 써서 실력 차이의 영향이 없어요.</p></div>

   ${maxDay>1?`<h3>연습 퀴즈 정답률 <small>공부 날짜별</small></h3>${lineChart(curve.map(s=>({...s})),Array.from({length:maxDay},(_,i)=>i+1+'일'),'정답률 (%)')}`:''}
   ${scat.length>=3?`<h3>공부 시간과 점수 향상 <small>한 점이 학생 한 명</small></h3>${scatter(scat,'총 공부 시간 (분)','사후 − 사전 (%p)')}`:''}</div>
  ${cm.tips!=null?`<div class="panel"><h3>공동체에 준 영향</h3><div class="kpis">${[['공유된 암기 팁',cm.tips+'개'],['도움됐어요',cm.likes+'번'],['요청 / 반영',cm.requests+' / '+cm.done+'개'],['반영까지 평균',cm.avgReplyDays!=null?f1(cm.avgReplyDays)+'일':'-'],['배려 모드 켠 횟수',(cm.a11yOn||0)+'번'],['협동 목표 달성',Math.min(100,Math.round((cm.studyCount||0)/COOP.goal*100))+'%'],['친구들의 한마디',(cm.notes||[]).length+'개']].map(([l,v])=>`<div class="kpi"><span>${l}</span><b style="font-size:1.35rem">${v}</b></div>`).join('')}</div>
   ${cm.needsN?`<h3>사용 전 조사: 단어 공부의 어려움 <small>${cm.needsN}명</small></h3>${barPairs(Object.entries(cm.needs).sort((a,b)=>b[1]-a[1]).map(([l,n])=>({label:l,a:n})),null,{fmt:v=>v+'명'})}`:''}
   ${(cm.notes||[]).length?`<h3>친구들의 한마디</h3><div class="quotes">${cm.notes.slice(-6).reverse().map(n=>`<blockquote>${esc(n.text)}</blockquote>`).join('')}</div>`:''}</div>`:''}
  <div class="panel"><div class="exp-head"><h3>보고서용 요약</h3><button class="small-b" id="sumCopy">복사</button></div><div id="sumText" class="summary">${sum.map(s=>`<p>${esc(s)}</p>`).join('')}</div>
   <h3>해석할 때 주의할 점</h3><ul class="limits"><li>참여 인원이 ${n.join}명으로 적어, 다른 학교나 학년으로 일반화하기 어렵다.</li><li>자발적으로 참여한 학생이라 공부 의지가 높은 학생이 많았을 수 있다.</li><li>학생이 앱 밖에서 실험 단어를 따로 공부했는지는 확인할 수 없다.</li><li>시험이 객관식이라 단어를 직접 쓰는 능력은 측정하지 않았다.</li></ul></div>
  <div class="panel"><div class="exp-head"><h3>학생별 기록</h3><span class="memo-row"><button class="small-b" id="csv">CSV 복사</button><span class="msg" id="csvMsg"></span></span></div>
   <textarea id="csvBox" hidden style="min-height:120px;font-family:var(--f-mono);font-size:.75rem"></textarea>
   <div class="tablewrap"><table><thead><tr><th>익명 번호</th><th>그룹</th>${PHASES.map(p=>`<th>${p[1]} 그림</th><th>${p[1]} 기본</th>`).join('')}<th>공부(분)</th><th>날 수</th></tr></thead>
   <tbody>${P.map(p=>`<tr><td>${esc(p.pid)}</td><td>${p.group}</td>${ph3.map(ph=>['A','B'].map(c=>{const v=sc(p,ph,c);return `<td>${v==null?'-':Math.round(v)}</td>`}).join('')).join('')}<td>${Math.round(((p.study?.A||0)+(p.study?.B||0))/60000)}</td><td>${p.days||0}</td></tr>`).join('')}</tbody></table></div></div>
  </div>`;
}
function csvOf(d){const h=['pid','group','pre_A','pre_B','post_A','post_B','delay_A','delay_B','study_min_A','study_min_B','days',...SQ_POST.map(q=>'post_'+q[0]),...SQ_PRE.map(q=>'pre_'+q[0])];
  const rows=(d.participants||[]).map(p=>[p.pid,p.group,...PHASES.flatMap(([ph])=>['A','B'].map(c=>{const v=sc(p,ph,c);return v==null?'':Math.round(v)})),Math.round((p.study?.A||0)/60000),Math.round((p.study?.B||0)/60000),p.days||0,
    ...SQ_POST.map(q=>p.sv?.post?.[q[0]]??''),...SQ_PRE.map(q=>p.sv?.pre?.[q[0]]??'')]);
  return [h,...rows].map(r=>r.join('\t')).join('\n')}
function demoData(){
  const r=rng('demo');const P=[];const clamp=v=>Math.max(0,Math.min(20,Math.round(v)));
  for(let i=1;i<=24;i++){const pid='E'+String(i).padStart(2,'0');const abil=r();const pre=2+abil*5;
    const dropout=i>21?(i>23?2:1):0;const p={pid,group:groupOf(pid),preAt:1,postAt:dropout<2?2:null,delayAt:dropout<1?3:null,scores:{},sv:{},study:{},days:Math.round(6+r()*8),prac:{}};
    const gA=5+abil*5+r()*5,gB=4.5+abil*5+r()*5;
    p.scores.pre={A:[clamp(pre+r()*2),20],B:[clamp(pre+r()*2),20]};
    if(p.postAt)p.scores.post={A:[clamp(pre+gA),20],B:[clamp(pre+gB),20]};
    if(p.delayAt)p.scores.delay={A:[clamp(pre+gA*(.55+r()*.4)),20],B:[clamp(pre+gB*(.45+r()*.4)),20]};
    p.study={A:(40+r()*60)*60000,B:(38+r()*60)*60000};
    for(let dd=1;dd<=14;dd++){const k=Math.min(.95,.45+dd*.035+abil*.1);p.prac[dd]={A:[Math.round(5*Math.min(.98,k+.06)),5],B:[Math.round(5*k),5]}}
    const L=v=>Math.max(1,Math.min(5,Math.round(v)));
    p.sv.pre={q1:L(2+abil*2),q2:L(2+r()*2),q3:L(2+r()*1.5),q4:L(2+abil*2)};
    if(p.postAt)p.sv.post={q1:L(3+abil*2),q2:L(3+r()*2),q3:L(3+r()*1.5),q4:L(3+abil*1.8),q5:L(3.5+r()*1.6),q6:L(3.3+r()*1.6),q7:L(3+r()*2),feat:sshuffle(FEATS.slice(0,5),pid).slice(0,2).join('|'),text:i%5===0?['그림이 있는 단어는 시험 볼 때 그림이 먼저 떠올랐어요.','예문을 따라 읽으니 쓰임이 이해됐어요.','기본 단어는 금방 까먹은 느낌이었어요.','하루 10분이라 부담이 없었어요.'][i/5-1]:''};
    P.push(p)}
  return{participants:P,community:{studyCount:4120,tips:37,likes:118,requests:12,done:7,avgReplyDays:1.8,a11yOn:9,needsN:27,needs:{'금방 잊어버려요':19,'뜻이 비슷해서 헷갈려요':11,'지루해서 오래 못 해요':9,'문장 속에서는 뜻을 모르겠어요':7,'시간이 부족해요':4,'발음을 몰라요':3},notes:[{text:'오답 랭킹 덕분에 시험 전에 어려운 단어만 골라 볼 수 있었어요.'},{text:'친구 팁으로 외운 단어는 시험에서 바로 생각났어요.'},{text:'큰 글씨 모드가 있어서 눈이 덜 피곤했어요.'}]}};
}

/* ================== 우리 반 (공동체) ================== */
let A11Y=store.get('a11y',{big:false,cvd:false,slow:false});
function applyA11y(){const r=document.documentElement;r.classList.toggle('a-big',!!A11Y.big);r.classList.toggle('a-cvd',!!A11Y.cvd)}
applyA11y();
let liked=store.get('liked',{});
const NEEDS=['금방 잊어버려요','뜻이 비슷해서 헷갈려요','지루해서 오래 못 해요','문장 속에서는 뜻을 모르겠어요','발음을 몰라요','시간이 부족해요'];


/* 보기 설정 (배려 모드) */
function a11yPanel(){
  return `<div class="a11y" id="a11y" hidden><b>보기 설정</b>
   <label><input type="checkbox" id="aBig" ${A11Y.big?'checked':''}> 큰 글씨</label>
   <label><input type="checkbox" id="aCvd" ${A11Y.cvd?'checked':''}> 색각 배려 색 (빨강·초록 대신 파랑·주황)</label>
   <label><input type="checkbox" id="aSlow" ${A11Y.slow?'checked':''}> 발음 천천히</label></div>`;
}
function bindA11y(){
  const btn=$('#a11yBtn'),pn=$('#a11y');btn.onclick=()=>{pn.hidden=!pn.hidden;btn.setAttribute('aria-expanded',!pn.hidden)};
  const upd=()=>{A11Y={big:$('#aBig').checked,cvd:$('#aCvd').checked,slow:$('#aSlow').checked};store.set('a11y',A11Y);applyA11y();
    if(SV.on&&(A11Y.big||A11Y.cvd||A11Y.slow))send({type:'a11y',big:A11Y.big?1:0,cvd:A11Y.cvd?1:0,slow:A11Y.slow?1:0})};
  ['#aBig','#aCvd','#aSlow'].forEach(s=>$(s).onchange=upd);
}

/* 도움됐어요 */
function likeBtn(t){if(!t.k)return '';const on=!!liked[t.k];return `<button class="like" data-like="${t.k}" aria-pressed="${on}">${ui('check')} 도움됐어요 <b>${(t.likes||0)}</b></button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-like]');if(!b)return;e.stopPropagation();const k=b.dataset.like;if(liked[k])return;
  liked[k]=1;store.set('liked',liked);send({type:'like',k:+k});const t=SV.tips.find(x=>String(x.k)===k);if(t)t.likes=(t.likes||0)+1;
  b.setAttribute('aria-pressed','true');b.querySelector('b').textContent=t?t.likes:'1'},true);

/* 필요 조사 카드 (처음 한 번) */
function needsCard(){
  if(store.get('needsDone',false)||!SV.on)return '';
  return `<div class="panel needs" id="needs"><div><span class="eyebrow-s">친구들의 목소리</span><h3>단어 공부할 때 가장 어려운 점은 무엇인가요?</h3><p class="lead">고른 답은 앱을 고치는 데 쓰여요. 누가 답했는지는 기록되지 않아요.</p></div>
   <div class="fam">${NEEDS.map(n=>`<button class="wchip need" data-need="${esc(n)}" aria-pressed="false">${esc(n)}</button>`).join('')}</div>
   <input id="needTxt" class="search" maxlength="120" placeholder="다른 어려움이 있다면 적어 주세요 (선택)">
   <div class="memo-row"><button class="b yes sm" id="needSend">보내기</button><button class="b sm" id="needSkip">다음에</button><span class="msg" id="needMsg"></span></div></div>`;
}
function bindNeeds(after){
  const box=$('#needs');if(!box)return;const pick=new Set();
  box.querySelectorAll('.need').forEach(b=>b.onclick=()=>{const n=b.dataset.need;pick.has(n)?pick.delete(n):pick.add(n);b.setAttribute('aria-pressed',pick.has(n))});
  $('#needSkip').onclick=()=>{store.set('needsDone',true);box.remove()};
  $('#needSend').onclick=()=>{const txt=$('#needTxt').value.trim();if(!pick.size&&!txt){$('#needMsg').className='msg err';$('#needMsg').textContent='하나 이상 골라 주세요.';return}
    send({type:'needs',answer:[...pick].join('|'),text:txt});store.set('needsDone',true);
    SV.comm=SV.comm||{};SV.comm.needs=SV.comm.needs||{};pick.forEach(n=>SV.comm.needs[n]=(SV.comm.needs[n]||0)+1);
    box.innerHTML='<p class="lead" style="margin:0">고마워요. 의견이 우리 반 탭의 "친구들이 말한 어려움"에 더해졌어요.</p>';if(after)setTimeout(after,1200)};
}

/* 우리 반 탭 */
function renderClass(){
  const c=SV.comm||{};const total=c.studyCount||0;const pctGoal=Math.min(100,total/COOP.goal*100);
  const ms=[25,50,75,100];const reached=ms.filter(m=>pctGoal>=m).length;
  const topTips=(SV.tips||[]).filter(t=>t.likes>0&&!(t.id!=null&&expHide(+t.id))).sort((a,b)=>b.likes-a.likes).slice(0,3);
  const needRows=Object.entries(c.needs||{}).sort((a,b)=>b[1]-a[1]).map(([l,n])=>({label:l,a:n}));
  const notes=(c.notes||[]).slice().reverse().slice(0,30);
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
  ${serverNote()}
  ${needsCard()}
  <div class="panel"><div><span class="eyebrow-s">함께 만든 변화</span><h2>우리 반이 이 앱으로 함께한 것</h2></div>
   <div class="kpis">${[['함께 쌓은 학습',(c.studyCount??'-'),'번'],['서로 나눈 암기 팁',(c.tips??'-'),'개'],['팁이 도움된 횟수',(c.likes??'-'),'번'],['배려 모드를 켠 횟수',(c.a11yOn??'-'),'번']].map(([l,v,u])=>`<div class="kpi"><span>${l}</span><b>${v}<small>${v==='-'?'':u}</small></b></div>`).join('')}</div></div>
  <p class="anon">이 앱은 이름, 학번, 기기 정보를 저장하지 않아요. 모든 기록은 누가 남겼는지 알 수 없는 익명으로 모여요.</p>
  <div class="panel coop"><div><span class="eyebrow-s">협동 목표</span><h2>${esc(COOP.title)}</h2><p class="lead">순위 대신 모두의 공부가 하나의 목표로 모여요. 카드에서 "몰라요/외웠어요"를 누르거나 퀴즈를 풀 때마다 1씩 채워져요.</p></div>
   <div class="goal"><div class="gbar"><i style="width:${pctGoal.toFixed(1)}%"></i>${ms.map(m=>`<span class="mk ${pctGoal>=m?'on':''}" style="left:${m}%"></span>`).join('')}</div>
   <div class="gnum"><b>${total.toLocaleString()}</b> / ${COOP.goal.toLocaleString()}번 · ${pctGoal.toFixed(0)}%</div></div>
   <p class="lead">${reached>=4?'목표를 달성했어요. 모두 수고했어요!':reached?`${ms[reached-1]}% 지점을 넘었어요. 다음 목표 ${ms[reached]}%까지 ${Math.max(0,Math.ceil(COOP.goal*ms[reached]/100-total)).toLocaleString()}번 남았어요.`:`첫 25%까지 ${Math.max(0,Math.ceil(COOP.goal*.25-total)).toLocaleString()}번 남았어요.`}</p></div>
  ${needRows.length?`<div class="panel"><div><h2>친구들이 말한 어려움</h2><p class="lead">이 의견을 보고 앱의 기능을 정했어요. 응답 ${c.needsN||0}명</p></div>${barPairs(needRows,null,{fmt:v=>v+'명'})}
   ${(c.needTexts||[]).length?`<div class="quotes">${c.needTexts.slice(-5).reverse().map(t=>`<blockquote>${esc(t)}</blockquote>`).join('')}</div>`:''}</div>`:''}
  ${topTips.length?`<div class="panel"><div><h2>친구들에게 가장 도움이 된 팁</h2></div>${topTips.map(t=>{const x=t.id!=null&&t.id!==''?W[t.id]:null;return `<div class="post"><div class="meta">${x?`<button class="wchip" data-go="${x.id}">${esc(x.w)}</button>`:'<span class="badge cat">공부 요령</span>'}</div><div class="txt">${esc(t.text)}</div><div>${likeBtn(t)}</div></div>`}).join('')}</div>`:''}
  <div class="panel"><div><h2>친구들의 한마디</h2><p class="lead">앱을 쓰며 도움이 된 점, 친구들에게 하고 싶은 응원을 남겨 주세요.</p></div>
   ${SV.on?`<div class="form">
    <label>한마디<textarea id="ntText" maxlength="200" placeholder="예: 오답 랭킹 덕분에 시험 전에 어려운 단어만 골라 볼 수 있었어요"></textarea></label>
    <div class="memo-row"><button class="b yes sm" id="ntSend">남기기</button><span class="msg" id="ntMsg"></span></div>
    <p class="hint" style="text-align:left;margin:0">이름, 학번, 연락처 같은 개인정보는 적지 마세요.</p></div>`:''}
   ${notes.length?notes.map(n=>`<div class="post"><div class="meta"><span>${fmtDate(n.time)}</span></div><div class="txt">${esc(n.text)}</div></div>`).join(''):(SV.loaded?'<p class="lead">아직 한마디가 없어요.</p>':'')}</div>
  </div>`;
  bindNeeds(renderClass);
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>goWord(+el.dataset.go));
  const ns=$('#ntSend');if(ns)ns.onclick=async()=>{const m=$('#ntMsg'),text=$('#ntText').value.trim();
    if(text.length<4){m.className='msg err';m.textContent='4글자 이상 적어 주세요.';return}
    if(Date.now()-lastPost<8000){m.className='msg err';m.textContent='잠시 후 다시 남겨 주세요.';return}
    lastPost=Date.now();await send({type:'note',text});SV.comm=SV.comm||{};SV.comm.notes=(SV.comm.notes||[]).concat([{text,time:new Date().toISOString()}]);
    m.className='msg ok';m.textContent='남겼어요. 고마워요!';setTimeout(renderClass,800)};
}

$('.prog').insertAdjacentHTML('beforeend',`<button class="small-b a11y-btn" id="a11yBtn" aria-expanded="false">보기 설정</button>`);$('header').insertAdjacentHTML('afterend',a11yPanel());bindA11y();
if(location.hash==='#admin'){$('#adminTab').hidden=false;S.tab='admin';setTabs()}
window.addEventListener('hashchange',()=>{if(location.hash==='#admin'){$('#adminTab').hidden=false;S.tab='admin';setTabs();render()}});
render();loadShared();flush();expSync();
</script>
